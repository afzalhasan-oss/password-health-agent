openapi: 3.1.0
info:
  title: Password Health Checker API
  version: 0.1.0
servers:
  - url: https://api.example.com
paths:
  /v1/health-checks:
    post:
      summary: Create password health assessment
      operationId: createHealthCheck
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [passwordCount, oldestPasswordAgeDays]
              properties:
                passwordCount:
                  type: integer
                  minimum: 0
                  maximum: 1000000
                oldestPasswordAgeDays:
                  type: integer
                  minimum: 0
                  maximum: 36500
      responses:
        '200':
          description: Assessment created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthCheckResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/health-checks/history:
    get:
      summary: Get historical health assessments for current session
      operationId: getHealthCheckHistory
      responses:
        '200':
          description: History fetched
          content:
            application/json:
              schema:
                type: object
                required: [items, trend]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/HistoryItem'
                  trend:
                    type: object
                    required: [direction, deltaFromPrevious]
                    properties:
                      direction:
                        type: string
                        enum: [IMPROVING, STABLE, DECLINING]
                      deltaFromPrevious:
                        type: integer
components:
  schemas:
    HealthCheckResponse:
      type: object
      required: [assessmentId, score, status, color, guidance]
      properties:
        assessmentId:
          type: string
          format: uuid
        score:
          type: integer
          minimum: 0
          maximum: 100
        status:
          type: string
          enum: [HEALTHY, OKAY, CRITICAL]
        color:
          type: string
          enum: [green, yellow, red]
        guidance:
          type: array
          minItems: 1
          maxItems: 5
          items:
            type: object
            required: [priorityRank, title, detail]
            properties:
              priorityRank:
                type: integer
                minimum: 1
              title:
                type: string
              detail:
                type: string
    HistoryItem:
      type: object
      required: [assessmentId, score, status, createdAt]
      properties:
        assessmentId:
          type: string
          format: uuid
        score:
          type: integer
          minimum: 0
          maximum: 100
        status:
          type: string
          enum: [HEALTHY, OKAY, CRITICAL]
        createdAt:
          type: string
          format: date-time
    ErrorResponse:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
        details:
          type: array
          items:
            type: string
