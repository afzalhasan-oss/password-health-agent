[project]
name = "password-health-backend"
version = "0.1.0"
description = "FastAPI backend for password health checker"
readme = "../README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.8.0",
  "python-dotenv>=1.0.1",
  "openai-agents>=0.0.14",
  "jsonschema>=4.23.0",
  "prisma>=0.15.0",
  "prisma-client-py>=0.12.0",
  "httpx>=0.27.0"
]

[dependency-groups]
dev = [
  "pytest>=8.2.0",
  "pytest-asyncio>=0.23.0",
  "ruff>=0.5.0"
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
line-length = 100
